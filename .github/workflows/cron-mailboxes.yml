# Cron syncu skrzynek (Gmail/Outlook -> CRM) co 5 minut.
#
# Vercel Hobby po cichu degraduje minutowe crony z apps/api/vercel.json do dziennych,
# więc harmonogram prowadzi GitHub Actions (ten sam wzorzec co w SimpleCRM).
# Sekrety repo: CRON_SECRET (identyczny jak w env crm-api na Vercelu), API_URL
# (np. https://api.crm.workshift.pl, bez końcowego ukośnika).
name: cron-mailboxes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /internal/sync/mailboxes
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Brak sekretów API_URL / CRON_SECRET w repo" >&2; exit 1
          fi
          curl -fsS -X POST "$API_URL/internal/sync/mailboxes" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
