# Dzienne zadania utrzymaniowe API (kursy walut dla PLN, sprzątanie archiwum).
# Od 2026-10-20 główny harmonogram to pg_cron w Supabase (workshift/supabase/pg-cron.sql),
# joby crm-sync-rates i crm-archive-prune. Workflow wyłączony (disabled_manually): GitHub blokował
# workflowy w tym forku 14-19.10, a crony z apps/api/vercel.json nie są zarejestrowane w Vercelu.
# Zostaje jako zapas do ręcznego `gh workflow run` po ponownym włączeniu.
name: cron-daily

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: rates + archive prune
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for p in /internal/sync/rates /internal/archive/prune; do
            curl -fsS -X POST "$API_URL$p" -H "Authorization: Bearer $CRON_SECRET" -w " -> HTTP %{http_code}\n" || echo "$p FAILED"
          done
